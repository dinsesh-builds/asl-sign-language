name: Bug report
description: Report something that does not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is fingerspelling practice, not an ASL interpreter. Please include what you signed and what the app showed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect and what did you see?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Where
      options:
        - Browser demo
        - Desktop Python
        - Dataset or training
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Python version or browser
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Lighting, camera and hand position
      description: These change landmark quality a lot.
